name: Setup problem
description: Stuck installing or configuring 501(c)(FREE)
labels: [setup]
body:
  - type: markdown
    attributes:
      value: First check the Troubleshooting table at the end of docs/setup.md. If that doesn't solve it, tell us where you got stuck.
  - type: dropdown
    id: step
    attributes:
      label: Which step?
      options:
        - Getting the code / pnpm install
        - Pasting supabase/setup.sql
        - pnpm onboard
        - Signing in
        - Deploying
        - An optional integration (QuickBooks, Claude, Resend, Liveblocks)
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: The exact message you saw, and what you were doing. Never paste secret keys.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Your setup
      placeholder: e.g. macOS 15, Node 22, pnpm 9
