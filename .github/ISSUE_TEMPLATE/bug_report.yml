name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
  - type: dropdown
    id: where
    attributes:
      label: Where are you running it?
      options:
        - Demo mode (no database)
        - Locally with my own Supabase project
        - Deployed (Vercel or another host)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `git rev-parse --short HEAD` in your copy.
  - type: textarea
    id: errors
    attributes:
      label: Error messages
      description: Browser console or terminal output. Remove any keys or personal data first.
      render: text
